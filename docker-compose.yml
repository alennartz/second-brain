services:
  server:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      BRAIN_DB_PATH: /data/brain.surreal
    volumes:
      - brain-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

  server-test:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env
    environment:
      BRAIN_DB_PATH: /data/brain-test.surreal
    volumes:
      - test-brain-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    profiles:
      - test

  server-mobile:
    build: .
    ports:
      - "${MOBILE_SERVER_BIND_ADDRESS:-127.0.0.1}:8200:8000"
    env_file: "${MOBILE_ENV_FILE:-.env.mobile.example}"
    environment:
      BRAIN_DB_PATH: /data/brain.surreal
    volumes:
      - mobile-brain-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    profiles:
      - mobile

volumes:
  brain-data:
  test-brain-data:
  mobile-brain-data:
