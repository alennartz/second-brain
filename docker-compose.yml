services:
  server:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - brain-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  server-test:
    build: .
    ports:
      - "8001:8000"
    environment:
      BRAIN_TEST_MODE: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    profiles:
      - test

  server-mobile:
    build: .
    ports:
      - "${MOBILE_SERVER_BIND_ADDRESS:?MOBILE_SERVER_BIND_ADDRESS is required; pass --env-file .env.mobile.local}:8200:8000"
    env_file: "${MOBILE_ENV_FILE:-.env.mobile.local}"
    environment:
      BRAIN_DB_PATH: /data/brain.db
      BRAIN_TEST_MODE: "false"
    volumes:
      - mobile-brain-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    profiles:
      - mobile

volumes:
  brain-data:
  mobile-brain-data:
